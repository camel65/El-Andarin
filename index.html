<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminantes en Contraste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        /* Botón de Inicio */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #fff;
            background: transparent;
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
            transform: scale(1.08);
        }

        /* Controles flotantes */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        #btn-salir:hover {
            background: rgba(255, 0, 85, 0.8);
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        /* Contenedor del lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Audio MP3 del Proyecto -->
    <audio id="miMusica" src="musica17.mp3" preload="auto" loop></audio>

    <!-- Botón de Inicio -->
    <button id="btn-inicio">Inicio</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="caminantesCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('caminantesCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let xAbajo = 0;
        let xArriba = 0;
        let velocidad = 2; // Velocidad inicial de caminata
        let faseAnimacion = 0;
        let activo = false;

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            xArriba = canvas.width;
        }

        window.addEventListener('resize', ajustarCanvas);

        // Control del botón de Audio (ON/OFF)
        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Sonido: OFF" : "🔊 Sonido: ON";
        });

        // --- CONTROLES DE LA PÁGINA ---
        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'flex';
            
            ajustarCanvas();
            xAbajo = -50;
            xArriba = canvas.width + 50;
            velocidad = 2;
            faseAnimacion = 0;
            activo = true;

            // Iniciar Audio
            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Sonido: ON";
            audioElement.play().catch(err => console.log(err));

            iniciarAnimacion();
        });

        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            audioElement.pause();
            audioElement.currentTime = 0;

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Función para dibujar una figura de persona caminando estilo monigote brillante
        function dibujarPersona(x, y, invertida, cicloPasos) {
            ctx.save();
            ctx.translate(x, y);
            if (invertida) {
                ctx.scale(-1, 1); // Voltear horizontalmente para los que van en sentido contrario
            }

            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';

            let oscilacionPiernas = Math.sin(cicloPasos) * 12;
            let oscilacionBrazos = Math.cos(cicloPasos) * 12;

            // Cabeza
            ctx.beginPath();
            ctx.arc(0, -38, 9, 0, Math.PI * 2);
            ctx.stroke();

            // Torso
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.lineTo(0, -2);
            ctx.stroke();

            // Brazos
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(oscilacionBrazos, -8);
            ctx.moveTo(0, -20);
            ctx.lineTo(-oscilacionBrazos, -8);
            ctx.stroke();

            // Piernas
            ctx.beginPath();
            ctx.moveTo(0, -2);
            ctx.lineTo(oscilacionPiernas, 22);
            ctx.moveTo(0, -2);
            ctx.lineTo(-oscilacionPiernas, 22);
            ctx.stroke();

            ctx.restore();
        }

        // --- BUCLE DE ANIMACIÓN ---
        function iniciarAnimacion() {
            if (!activo) return;

            // Fondo negro con leve estela translúcida
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            faseAnimacion += velocidad * 0.15;

            // Posiciones Y de las figuras (Abajo y Arriba)
            let yAbajo = canvas.height - 90;
            let yArriba = 110;

            // Actualizar posiciones con sentidos contrarios
            xAbajo += velocidad;                     // Va hacia la derecha
            xArriba -= velocidad;                    // Va hacia la izquierda (sentido contrario)

            // Reaparecer al cruzar la pantalla (bucle infinito)
            if (xAbajo > canvas.width + 50) xAbajo = -50;
            if (xArriba < -50) xArriba = canvas.width + 50;

            // Dibujar caminante de abajo (mirando a la derecha)
            dibujarPersona(xAbajo, yAbajo, false, faseAnimacion);

            // Dibujar caminante de arriba (mirando a la izquierda -> invertida = true)
            dibujarPersona(xArriba, yArriba, true, faseAnimacion);

            // Líneas divisorias sutiles arriba y abajo para enmarcar la escena
            ctx.beginPath();
            ctx.moveTo(0, 40);
            ctx.lineTo(canvas.width, 40);
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Incrementar la velocidad de forma continua (cada vez más deprisa)
            velocidad += 0.0015;

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
